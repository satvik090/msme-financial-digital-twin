services:
  - type: pserv
    name: msme-twin-ml
    runtime: docker
    dockerContext: ./ml-service
    dockerfilePath: ./ml-service/Dockerfile
    plan: free
  - type: web
    name: msme-financial-digital-twin
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: msme-twin-db
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          name: msme-twin-ml
          type: pserv
          property: hostport
      - key: CORS_ORIGIN
        value: https://placeholder.invalid
      - key: DEMO_MODE
        value: "true"
      - key: EVENT_WORKER_ENABLED
        value: "true"
databases:
  - name: msme-twin-db
    plan: free
  - type: web
    name: msme-frontend
    env: static
    buildCommand: cd frontend && npm install && ng build --configuration production
    staticPublishPath: ./frontend/dist/msme-digital-twin/browser
    envVars:
      - key: NODE_VERSION
        value: 18
      # Ensure your frontend environment.prod.ts has the correct API URL
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN