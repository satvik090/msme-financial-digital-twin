services:
  - type: web
    name: msme-financial-twin-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build -- --configuration production
    staticPublishPath: ./frontend/dist/dashboard/browser
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN

  - type: web
    name: msme-twin-ml
    runtime: docker
    dockerContext: ./ml-service
    dockerfilePath: ./ml-service/Dockerfile
    plan: free

  - type: web
    name: msme-financial-digital-twin
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: PORT
        value: "10000"

      - key: DATABASE_URL
        sync: false

      - key: ML_SERVICE_URL
        fromService:
          name: msme-twin-ml
          type: web
          property: host

      - key: DEMO_MODE
        value: "true"

      - key: EVENT_WORKER_ENABLED
        value: "true"